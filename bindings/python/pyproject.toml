[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "gdp-rs"
version = "0.1.0"
description = "Rust-backed proof contracts for Python authorization boundaries"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "CloudThinker AI" }]
keywords = ["authorization", "proof-contracts", "rust", "gdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/cloudthinker-ai/proofbound"
Documentation = "https://github.com/cloudthinker-ai/proofbound/blob/main/docs/python.md"
Source = "https://github.com/cloudthinker-ai/proofbound"
Issues = "https://github.com/cloudthinker-ai/proofbound/issues"
Security = "https://github.com/cloudthinker-ai/proofbound/blob/main/SECURITY.md"

[project.scripts]
gdp-lint = "gdp.lint:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pyrefly>=1.3.1,<2", "fastapi>=0.141.1,<1", "httpx2>=2.13.1,<3"]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "gdp._gdp"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
