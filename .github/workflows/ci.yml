name: Proof contracts

on:
  push:
    paths-ignore:
      - "docs/**"
      - "plans/**"
      - "wiki/**"
      - ".agents/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plans/**"
      - "wiki/**"
      - ".agents/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: rustup show
      - run: make install PYTHON=python
      - run: make check
      - run: make package-check
      - run: |
          uv venv --python python .test-venv
          uv pip install --python .test-venv/bin/python dist/*.whl -r requirements-dev.txt
          .test-venv/bin/python -m pytest bindings/python/tests -q
          .test-venv/bin/python examples/python/main.py
          .test-venv/bin/gdp-lint examples/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdp-python-${{ matrix.python }}
          path: dist/*

  advisory-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup show
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
