name: Proof contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: rustup show
      - run: make install PYTHON=python
      - run: make check
      - run: make package-check
      - run: |
          uv venv --python python .test-venv
          uv pip install --python .test-venv/bin/python dist/*.whl -r requirements-dev.txt
          .test-venv/bin/python -m pytest bindings/python/tests -q
          .test-venv/bin/python examples/python/main.py
          .test-venv/bin/gdp-lint examples/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdp-python-${{ matrix.python }}
          path: dist/*

  wheels:
    name: wheels (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: manylinux_2_17_x86_64.manylinux2014_x86_64
            artifact: linux-x64
            manylinux: "2014"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: manylinux_2_17_aarch64.manylinux2014_aarch64
            artifact: linux-arm64
            manylinux: "2014"
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macosx_11_0_arm64
            artifact: macos-arm64
            manylinux: "off"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win_amd64
            artifact: windows-x64
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.90.0"
          maturin-version: "1.14.1"
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist
      - run: python scripts/test_wheel.py --platform ${{ matrix.platform }}
      - run: uv run --no-project --python 3.12 python scripts/test_wheel.py --platform ${{ matrix.platform }}
      - run: uv run --no-project --python 3.13 python scripts/test_wheel.py --platform ${{ matrix.platform }}
      - run: uv run --no-project --python 3.14 python scripts/test_wheel.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofbound-wheel-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  advisory-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup show
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
